name: Generate vendor tree
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install git-lfs
        run: |
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone AOSPA vendor with LFS
        run: |
          GIT_LFS_SKIP_SMUDGE=0 git clone --depth=1 \
            https://gitlab.com/aospa-timo/op7/vendor/oneplus/oneplus7tpronr \
            vendor_tree
          cd vendor_tree
          git lfs pull

      - name: Fix soong_namespace
        run: |
          printf '// Automatically generated file. DO NOT MODIFY\n//\n// This file is generated by device/oneplus/hotdogg/setup-makefiles.sh\n\nsoong_namespace {\n    imports: [\n        "vendor/oneplus/sm8150-common",\n        "device/oneplus/sm8150-common",\n        "hardware/oneplus",\n        "hardware/qcom-caf/sm8150",\n        "hardware/qcom/wlan/legacy",\n        "vendor/qcom/opensource/display",\n        "vendor/qcom/opensource/dataservices",\n    ],\n}\n' > vendor_tree/Android.bp

      - name: Rename vendor makefile
        run: |
          mv vendor_tree/oneplus7tpronr-vendor.mk vendor_tree/hotdogg-vendor.mk 2>/dev/null || true

      - name: Rename product makefile
        run: |
          mv vendor_tree/oneplus7tpronr.mk vendor_tree/hotdogg.mk 2>/dev/null || true

      - name: Patch build identity files only
        run: |
          find vendor_tree -type f \( -name "*.mk" -o -name "*.bp" \) \
            -exec sed -i 's/oneplus7tpronr/hotdogg/g' {} +

      - name: Copy files to fresh repo
        run: |
          mkdir vendor_fresh
          cp -r vendor_tree/. vendor_fresh/
          rm -rf vendor_fresh/.git
          rm -f vendor_fresh/.gitattributes

      - name: Commit and push fresh repo
        run: |
          cd vendor_fresh
          git init
          git config user.name "Shahzeb Qureshi"
          git config user.email "shahzebqureshi6@gmail.com"
          git config http.postBuffer 524288000
          git config http.lowSpeedLimit 0
          git config http.lowSpeedTime 999999
          git remote add origin https://x-access-token:${{ secrets.PAT }}@github.com/ShahzebQureshi/vendor_oneplus_hotdogg.git
          git add -A
          git commit -m "hotdogg: adapt AOSPA vendor for YAAP A16"
          git branch -M main
          git push origin main --force
